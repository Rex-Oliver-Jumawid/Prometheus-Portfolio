name: Bootstrap Three.js lockfile

on:
  push:
    branches:
      - chore/portfolio-architecture
    paths:
      - package.json
      - .github/workflows/bootstrap-three-lockfile.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/portfolio-architecture

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync Three.js lockfile"
          git push origin HEAD:chore/portfolio-architecture
